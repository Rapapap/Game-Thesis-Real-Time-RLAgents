# PPO Baseline Configuration — No Curriculum
#
# This config trains WITHOUT curriculum learning (static player only).
# For curriculum learning, use: NormalEnemyCC.yaml
#
# To train:
#   mlagents-learn config/ppo/NormalEnemyCC_NoCurriculum.yaml --run-id=PPO-NoCurriculum
#
# View results:
#   tensorboard --logdir=results

behaviors:
  NormalEnemy:
    trainer_type: ppo
    max_steps: 5000000
    time_horizon: 512
    summary_freq: 10000
    threaded: false
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
