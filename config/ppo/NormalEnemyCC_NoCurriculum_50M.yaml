# PPO Baseline Configuration — 50 Million Steps (50M Convergence Run)
#
# To train:
#   mlagents-learn config/ppo/NormalEnemyCC_NoCurriculum_50M.yaml --run-id=PPO_NoCurriculum_50M --env="C:\Users\RavaRazan\Downloads\Builds-NewBotPlayer\Code Crusader.exe" --no-graphics --num-envs=8 --force
#
# View results:
#   tensorboard --logdir=results

behaviors:
  NormalEnemy:
    trainer_type: ppo
    max_steps: 50000000
    time_horizon: 512
    summary_freq: 20000
    threaded: false
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.002              # Matched with HCA for fair entropy comparison
      epsilon: 0.20
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
